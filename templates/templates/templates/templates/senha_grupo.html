```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Entrar no grupo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #151515;
            color: white;
        }

        .caixa {
            width: 350px;

            padding: 30px;

            background: #1f1f1f;

            border-radius: 12px;

            text-align: center;
        }

        .caixa h1 {
            margin-bottom: 10px;
        }

        .caixa p {
            color: #999;
        }

        .erro {
            background: #5c2020;

            color: #ffb3b3;

            padding: 10px;

            border-radius: 7px;

            margin: 15px 0;
        }

        input {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #303030;

            color: white;

            outline: none;

            margin-top: 10px;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 12px;

            border: none;

            border-radius: 7px;

            background: #5865f2;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        a {
            display: block;

            margin-top: 15px;

            color: #aaa;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="caixa">

        <h1>🔒 {{ grupo["nome"] }}</h1>

        <p>
            Esse grupo possui uma senha.
        </p>

        {% if erro %}

            <div class="erro">
                {{ erro }}
            </div>

        {% endif %}

        <form method="POST">

            <input
                type="password"
                name="senha"
                placeholder="Digite a senha do grupo"
                required
            >

            <button type="submit">
                Entrar no grupo
            </button>

        </form>

        <a href="{{ url_for('chat') }}">
            ← Voltar para o Chat Global
        </a>

    </div>

</body>

</html>
```
